name: Production preview build and TestFlight

# No `on:` trigger: this only runs when you explicitly invoke it:
#   npm run workflow:production-preview
#
# Android: `production-preview` profile, an internal-distribution APK on the
# production channel and production backend. Use it for the pre-release smoke test
# and the rider pilot. Build only: an automatic Play Store submit is never wired up.
#
# iOS: `production` profile (store distribution; an ad-hoc/internal iOS build cannot
# be uploaded to TestFlight) submitted to TestFlight via the `production` submit profile.

jobs:
  build_android:
    name: Build Android (production preview)
    type: build
    params:
      platform: android
      profile: production-preview

  build_ios:
    name: Build iOS (production)
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit iOS to TestFlight
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
